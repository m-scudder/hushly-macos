name: Hushly
options:
  bundleIdPrefix: com.hushly
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Hushly:
    type: application
    platform: macOS
    sources:
      - path: Hushly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hushly.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        CODE_SIGN_ENTITLEMENTS: Hushly/Hushly.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
